<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Apostas do Zé</title>
  
  <!-- PWA Manifest & Theme -->
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#10b981">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <!-- Tailwind CSS para um design moderno e responsivo -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col items-center justify-between p-4">

  <!-- Cabeçalho -->
  <header class="w-full max-w-md bg-slate-800 p-4 rounded-2xl shadow-lg flex justify-between items-center mb-4">
    <div>
      <h1 class="text-xl font-bold text-emerald-400">Apostas do Zé</h1>
      <p class="text-xs text-slate-400">Gestão de Apostas & Saldos</p>
    </div>
    <div id="saldo-atual" class="text-right">
      <span class="block text-xs text-slate-400">Saldo Atual</span>
      <span class="text-lg font-semibold text-emerald-400">0.00 €</span>
    </div>
  </header>

  <!-- Conteúdo Principal -->
  <main class="w-full max-w-md bg-slate-800 p-5 rounded-2xl shadow-lg flex-grow flex flex-col gap-4">
    <section id="nova" class="flex flex-col gap-3">
      <h2 class="text-sm font-semibold text-slate-300 uppercase tracking-wider">Registar Aposta</h2>
      <input type="text" id="descricao" placeholder="Descrição (ex: Jogo Benfica)" class="bg-slate-900 border border-slate-700 p-3 rounded-xl text-sm focus:outline-none focus:border-emerald-500">
      <input type="number" step="0.01" id="valor" placeholder="Valor (€)" class="bg-slate-900 border border-slate-700 p-3 rounded-xl text-sm focus:outline-none focus:border-emerald-500">
      <button onclick="registarAposta()" class="bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-bold p-3 rounded-xl transition">Adicionar Aposta</button>
    </section>

    <hr class="border-slate-700">

    <section id="saldo" class="flex flex-col gap-2 flex-grow">
      <h2 class="text-sm font-semibold text-slate-300 uppercase tracking-wider">Histórico</h2>
      <div id="historico" class="flex flex-col gap-2 overflow-y-auto max-h-48 pr-1 text-sm">
        <p class="text-slate-500 text-center italic py-4">Sem apostas registadas.</p>
      </div>
    </section>
  </main>

  <!-- Rodapé -->
  <footer class="w-full max-w-md text-center py-3 text-xs text-slate-500">
    Apostas do Zé &copy; 2026 — Sincronização Ativa
  </footer>

  <!-- Lógica da Aplicação & Registo do Service Worker -->
  <script>
    // Registo automático do Service Worker para suporte PWA/Offline
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then((reg) => console.log('ServiceWorker registado com sucesso:', reg.scope))
          .catch((err) => console.log('Erro ao registar ServiceWorker:', err));
      });
    }

    // Lógica simples de exemplo para a interface
    let saldoTotal = 0.0;
    let apostas = [];

    function registarAposta() {
      const descInput = document.getElementById('descricao');
      const valorInput = document.getElementById('valor');
      const historicoDiv = document.getElementById('historico');
      const saldoDisplay = document.querySelector('#saldo-atual span:last-child');

      const desc = descInput.value.trim();
      const valor = parseFloat(valorInput.value);

      if (!desc || isNaN(valor)) {
        alert('Por favor, preenche todos os campos corretamente.');
        return;
      }

      apostas.push({ desc, valor });
      saldoTotal += valor;

      // Atualizar visualização do saldo
      saldoDisplay.textContent = saldoTotal.toFixed(2) + ' €';

      // Atualizar histórico
      if (apostas.length === 1) {
        historicoDiv.innerHTML = '';
      }

      const item = document.createElement('div');
      item.className = 'bg-slate-900 p-3 rounded-xl flex justify-between items-center border border-slate-700/50';
      item.innerHTML = `<span>${desc}</span><span class="${valor >= 0 ? 'text-emerald-400' : 'text-rose-400'} font-semibold">${valor.toFixed(2)} €</span>`;
      historicoDiv.prepend(item);

      // Limpar campos
      descInput.value = '';
      valorInput.value = '';
    }
  </script>
</body>
</html>
